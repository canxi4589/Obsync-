name: Deploy Obsync PWA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "obsync-web/**"
      - ".github/workflows/deploy-pwa.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "obsync-web/package-lock.json"
      - name: Install dependencies
        working-directory: obsync-web
        run: npm install
      - name: Typecheck & Test
        working-directory: obsync-web
        run: npm run typecheck && npm test
      - name: Build PWA
        working-directory: obsync-web
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: obsync-web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
